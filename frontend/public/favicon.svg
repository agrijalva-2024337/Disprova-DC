<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Disprova GyG">
  <!--
    Isotipo de Disprova GyG: "GyG" en la serif del logo sobre el rojo de marca.
    Sustituye al favicon que traía Vite, que no decía nada del negocio.
    Fraunces lleva fallback en serif: si la fuente no está instalada, el glifo
    se dibuja con la serif del sistema en vez de romperse.
  -->
  <defs>
    <linearGradient id="gyg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A3221C"/>
      <stop offset="100%" stop-color="#7A1712"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#gyg)"/>
  <text x="32" y="43"
        font-family="Fraunces, Georgia, 'Times New Roman', serif"
        font-size="27"
        font-style="italic"
        font-weight="600"
        fill="#FFFFFF"
        text-anchor="middle"
        letter-spacing="-0.5">GyG</text>
</svg>
