services:
  postgres:
    image: postgres:16-alpine
    container_name: disprova-postgres
    environment:
      POSTGRES_USER: disprova
      POSTGRES_PASSWORD: disprova_dev_password
      POSTGRES_DB: disprova
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U disprova -d disprova"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: disprova-backend
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: disprova
      POSTGRES_PASSWORD: disprova_dev_password
      POSTGRES_DB: disprova
      PORT: 3000
      NODE_ENV: development
      DATABASE_URL: postgresql://disprova:disprova_dev_password@postgres:5432/disprova
    ports:
      - "3000:3000"
    volumes:
      - ./backend/src:/app/src
      - ./backend/tsconfig.json:/app/tsconfig.json
      - ./backend/prisma:/app/prisma
    depends_on:
      postgres:
        condition: service_healthy

  # Respaldo diario de PostgreSQL. La sección 6 de la planificación pide
  # "pg_dump programado" y "respaldo diario fuera del servidor": los archivos
  # se escriben en un bind mount del host, no en el contenedor, para que
  # sobrevivan a que el contenedor se borre.
  #
  # La lógica vive en scripts/backup.sh y no en el entrypoint: Compose expande
  # las `$` del shell antes de dárselas al contenedor, así que un `$(date ...)`
  # escrito acá se pierde o se evalúa en el host. Con el script montado, el
  # shell corre dentro del contenedor y las variables se comportan bien.
  #
  # Por defecto a las 03:10 de Guatemala y no a medianoche: el cierre de caja de
  # la jornada anterior suele terminar cerca de esa hora, y respaldar a las
  # 00:00 se llevaría una base a medio escribir.
  backup:
    image: postgres:16-alpine
    container_name: disprova-backup
    environment:
      PGHOST: postgres
      PGUSER: disprova
      PGPASSWORD: disprova_dev_password
      PGDATABASE: disprova
      TZ: America/Guatemala
      # A qué hora corre, en HHMM. Configurable sin tocar el script.
      HORA_BACKUP: "0310"
      # Cuántos días de respaldo se conservan.
      RETENCION_DIAS: "30"
    volumes:
      - ./backups:/backups
      - ./scripts/backup.sh:/usr/local/bin/backup.sh:ro
    entrypoint: ["sh", "/usr/local/bin/backup.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
