# Sin estos scripts `prisma generate` no descarga las engines.
# `onlyBuiltDependencies` lo lee pnpm 10 (Docker). `allowBuilds` lo lee pnpm 11.
onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - prisma
  - esbuild
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
  esbuild: true
  '@scarf/scarf': false
